# Entorno conda con el que se obtuvieron los resultados del módulo de
# clasificación (exp04), el experimento de ablación (exp05) y la línea base
# de regresión logística (exp06), así como la preparación del truth set para
# hap.py.
#
#   Sistema      : Ubuntu 26.04 LTS (instalación limpia, 20/05/2026 17:51)
#   Creado el    : 20/05/2026 19:19
#   Exportado el : 14/08/2026
#
# Las herramientas del pipeline (FastQC, Trim Galore, BWA, GATK, VEP, MultiQC,
# hap.py) NO se toman de aquí: se ejecutan en contenedores Docker con etiqueta
# fija declarada en modules/*.nf. Este entorno solo cubre los scripts de Python
# y las utilidades auxiliares (BCFtools, BEDtools).
#
# El liftover del MAF se ejecutó el 13/05/2026 con CrossMap 0.7.2 sobre el
# entorno anterior (WSL2), previo a la migración descrita en NB-007. Esa
# versión no está en este fichero.
#
# Reproducción:
#     conda env create -f entorno/environment_ubuntu_2026-05.yml
